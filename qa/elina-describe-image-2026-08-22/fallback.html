<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Describe Image — static task</title>
  <style>
    :root { --ink:#18201e; --muted:#5f6a67; --paper:#f5f3ed; --card:#fffefa; --line:#dedbd2; --teal:#2f6758; --teal-soft:#dce8e2; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(1180px,calc(100% - 28px)); margin:14px auto 22px; }
    .card { padding:clamp(16px,2vw,28px); background:var(--card); border:1px solid var(--line); border-radius:18px; }
    h1 { margin:0 0 8px; font-size:clamp(24px,3vw,38px); letter-spacing:-.03em; }
    .lead { margin:0 0 16px; color:var(--muted); line-height:1.45; }
    .visual { width:100%; max-width:100%; min-width:0; display:grid; place-items:center; min-height:0; padding:8px; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    .visual img { display:block; min-width:0; max-width:100%; width:100%; height:auto; max-height:62vh; object-fit:contain; }
    .manual { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px; }
    .manual div { padding:12px; background:var(--teal-soft); border-radius:12px; }
    .manual strong { display:block; margin-bottom:4px; }
    .cue-line { margin:14px 0 0; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.06em; text-align:center; }
    .teacher { margin-top:14px; color:var(--muted); font-size:13px; line-height:1.45; }
    @media (max-width:650px) { main { width:100%; margin:0; } .card { border-radius:0; border-left:0; border-right:0; } .manual { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-label="Static Describe Image task">
      <div class="visual"><img src="assets/PTEA-DI-PTP2-2018-003-item.png" alt="Pearson Describe Image task visual"></div>
      <div class="manual">
        <div><strong>Prepare — 25 seconds</strong>Choose the main message, useful details, a relationship and an ending.</div>
        <div><strong>Speak — 40 seconds</strong>Start after the tone. Speak in your own words and finish before time ends.</div>
      </div>
      <p class="cue-line" aria-label="Speaking sequence">MAIN → DETAILS → RELATION → END</p>
    </section>
  </main>
</body>
</html>
